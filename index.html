<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Korean Particle Check</title>
<meta name="description" content="Find out what's really confusing you about Korean particles in 5 minutes. A free learning check from Korean Joa Academy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#F5F7F5;
  --surface:#FFFFFF;
  --ink:#1D2733;
  --muted:#56616C;
  --line:#D8E0DC;
  --celadon:#3F7466;
  --celadon-soft:#E3EEEA;
  --ochre:#8A5E24;
  --ochre-soft:#F6EEE2;
  --rose:#94403E;
  --rose-soft:#F7E9E8;
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131A1F;--surface:#1A2329;--ink:#E6ECE9;--muted:#9AA7AF;--line:#2D3942;
    --celadon:#86BBAB;--celadon-soft:#1E3530;--ochre:#D9AE70;--ochre-soft:#302718;
    --rose:#E0948F;--rose-soft:#3A2323;
  }
}
:root[data-theme="dark"]{
  --paper:#131A1F;--surface:#1A2329;--ink:#E6ECE9;--muted:#9AA7AF;--line:#2D3942;
  --celadon:#86BBAB;--celadon-soft:#1E3530;--ochre:#D9AE70;--ochre-soft:#302718;
  --rose:#E0948F;--rose-soft:#3A2323;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
.ko{font-family:"Gowun Batang","Nanum Myeongjo","AppleMyungjo","Batang",serif;word-break:keep-all;overflow-wrap:break-word}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
button{font:inherit;color:inherit}
a{color:var(--celadon)}
:focus-visible{outline:3px solid var(--celadon);outline-offset:3px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}

.app{max-width:600px;margin:0 auto;padding:28px 20px 56px}
.screen{transition:opacity .18s ease,transform .18s ease}
.screen.leaving{opacity:0;transform:translateY(6px)}
@media (prefers-reduced-motion:reduce){.screen{transition:none}.screen.leaving{transform:none}}

.brand{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted);margin-bottom:40px}
.brand img{height:28px;width:auto}
.brand-mark{width:10px;height:10px;border-radius:50%;background:var(--celadon)}

/* Intro */
.hero-sentence{font-size:clamp(2.1rem,9vw,3.1rem);line-height:1.5;margin:0 0 6px;font-weight:400}
.hero-meaning{color:var(--muted);margin:0 0 44px;font-size:.95rem}
h1.title{font-family:"Gowun Batang",Georgia,serif;font-weight:700;font-size:clamp(1.9rem,6.5vw,2.4rem);line-height:1.2;margin:0 0 12px;letter-spacing:-.01em}
.lede{font-size:1.12rem;margin:0 0 28px;color:var(--ink);max-width:34em}
.facts{margin:0 0 32px;padding:0;list-style:none;border-top:1px solid var(--line)}
.facts li{padding:14px 0;border-bottom:1px solid var(--line);color:var(--muted);font-size:.97rem}
.facts strong{color:var(--ink);font-weight:500}

/* Slot */
.slot{
  display:inline-block;min-width:1.7em;text-align:center;
  border-bottom:2px solid var(--celadon);color:var(--celadon);
  margin:0 .06em;padding:0 .08em;line-height:1.15;vertical-align:baseline;
}
.slot.filled{font-weight:700}
.slot .fill{display:inline-block;animation:drop .28s ease-out}
@keyframes drop{from{opacity:0;transform:translateY(-.35em)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slot .fill{animation:none}}

/* Question */
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:34px}
.back{
  display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:8px 6px 8px 0;
  color:var(--muted);cursor:pointer;font-size:.95rem;min-height:44px;
}
.back svg{width:18px;height:18px}
.progress{flex:1;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.progress-text{font-size:.85rem;color:var(--muted)}
.segments{display:flex;gap:4px;width:100%;max-width:260px}
.segments span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.segments span.done{background:var(--celadon)}
.segments span.now{background:var(--ink)}

.context{color:var(--muted);margin:0 0 18px;font-size:1rem}
.context .ko{color:var(--ink);font-size:1.15rem}
.sentence{font-size:clamp(1.6rem,6.4vw,2.15rem);line-height:1.7;margin:0 0 6px}
.meaning{color:var(--muted);font-size:.95rem;margin:0 0 18px}
.gloss{margin:0 0 22px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:.93rem}
.gloss-title{margin:0 0 6px;color:var(--muted);font-size:.85rem}
.gloss dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.gloss dt{font-family:"Gowun Batang",serif;font-weight:700}
.gloss dd{margin:0;color:var(--muted)}
.prompt{font-size:1.05rem;font-weight:500;margin:6px 0 16px}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.opts.stack{grid-template-columns:1fr}
.opt{
  min-height:58px;padding:12px 14px;border:1.5px solid var(--line);background:var(--surface);
  border-radius:var(--radius);cursor:pointer;text-align:center;
  transition:border-color .12s ease,background-color .12s ease;
}
.opt.ko{font-size:1.45rem}
.opts.stack .opt{text-align:left;font-size:1.05rem}
.opts.stack .opt.ko{font-size:1.22rem}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--celadon);background:var(--celadon-soft)}
.alts{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 30px}
.alt{
  min-height:44px;padding:8px 16px;border:1px dashed var(--line);background:transparent;
  border-radius:999px;cursor:pointer;color:var(--muted);font-size:.93rem;
}
.alt[aria-pressed="true"]{border-style:solid;border-color:var(--ink);color:var(--ink);background:var(--surface)}
.primary{
  display:inline-flex;align-items:center;justify-content:center;width:100%;min-height:54px;
  background:var(--ink);color:var(--paper);border:0;border-radius:var(--radius);
  font-weight:600;font-size:1.02rem;cursor:pointer;text-decoration:none;padding:12px 20px;text-align:center;
}
.primary:disabled{opacity:.3;cursor:not-allowed}
.primary.celadon{background:var(--celadon);color:var(--surface)}
.hint{font-size:.85rem;color:var(--muted);margin:10px 0 0;text-align:center;min-height:1.3em}

/* Result */
.result-kicker{color:var(--muted);font-size:.95rem;margin:0 0 6px}
.result-title{font-family:"Gowun Batang",Georgia,serif;font-weight:700;font-size:clamp(2rem,7.5vw,2.6rem);line-height:1.15;margin:0 0 14px}
.result-intro{font-size:1.08rem;margin:0 0 12px}
.result-intro + p{margin-top:0}
section.block{margin-top:40px}
section.block h2{font-size:1.02rem;font-weight:600;margin:0 0 14px}
.dims{border-top:1px solid var(--line)}
.dim{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.dim-name{font-weight:500}
.dim-band{font-size:.9rem;text-align:right}
.dim-band.secure{color:var(--celadon)}
.dim-band.developing{color:var(--ochre)}
.dim-band.notyet,.dim-band.nee{color:var(--muted)}
.dots{display:flex;gap:6px;grid-column:1/-1;align-items:center}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--celadon)}
.dot.full{background:var(--celadon)}
.dot.half{background:linear-gradient(90deg,var(--celadon) 50%,transparent 50%)}
.dot.unknown{border-style:dotted;border-color:var(--muted)}
.dot.empty{border-color:var(--line)}
.dim-count{font-size:.85rem;color:var(--muted);margin-left:8px}
.strengths{margin:0;padding:0;list-style:none}
.strengths li{padding:10px 0 10px 22px;position:relative}
.strengths li::before{content:"";position:absolute;left:2px;top:1.05em;width:8px;height:8px;border-radius:50%;background:var(--celadon)}
.priority-title{font-family:"Gowun Batang",Georgia,serif;font-size:1.35rem;font-weight:700;margin:0 0 14px;line-height:1.35}
.example{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--celadon);border-radius:4px var(--radius) var(--radius) 4px;padding:18px 18px 16px}
.example .ko-line{font-size:1.45rem;line-height:1.6;margin:0}
.example .en{color:var(--muted);margin:8px 0 12px;font-size:.95rem}
.example .note{margin:0}
.note-form{margin-top:16px;padding:12px 14px;background:var(--ochre-soft);border-radius:10px;font-size:.95rem}
.next{background:var(--celadon-soft);border-radius:var(--radius);padding:22px 20px}
.next h3{font-family:"Gowun Batang",Georgia,serif;font-size:1.3rem;margin:0 0 6px}
.next p{margin:0 0 14px}
.next .small{font-size:.88rem;color:var(--muted);margin:12px 0 0}
.kit{border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-top:16px;background:var(--surface)}
.kit p{margin:0 0 14px}
.kit .small{font-size:.88rem;color:var(--muted);margin:12px 0 0}
.secondary{
  display:inline-flex;align-items:center;justify-content:center;width:100%;min-height:50px;
  border:1.5px solid var(--ink);border-radius:var(--radius);background:transparent;color:var(--ink);
  font-weight:600;text-decoration:none;cursor:pointer;padding:10px 18px;
}

details.review-all{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
details.review-all > summary{padding:16px 0;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:44px}
details > summary::-webkit-details-marker{display:none}
.chev{width:18px;height:18px;transition:transform .15s ease;flex:none}
details[open] > summary .chev{transform:rotate(180deg)}
.qrev{border-top:1px solid var(--line)}
.qrev > summary{padding:14px 0;cursor:pointer;list-style:none;display:flex;gap:12px;align-items:center;min-height:44px}
.qrev-num{color:var(--muted);font-size:.9rem;width:1.6em;flex:none}
.qrev-short{flex:1;font-size:1.05rem}
.tag{font-size:.8rem;padding:3px 9px;border-radius:999px;white-space:nowrap;flex:none}
.tag.correct{background:var(--celadon-soft);color:var(--celadon)}
.tag.form,.tag.half{background:var(--ochre-soft);color:var(--ochre)}
.tag.error{background:var(--rose-soft);color:var(--rose)}
.tag.unsure,.tag.notlearned{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.qrev-body{padding:0 0 18px 2.8em;font-size:.96rem}
.qrev-body p{margin:0 0 8px}
.qrev-body .lbl{color:var(--muted)}
.fine{font-size:.88rem;color:var(--muted);margin-top:36px}
.fine p{margin:0 0 10px}
.restart{margin-top:24px}

.site-footer{max-width:600px;margin:0 auto;padding:22px 20px 32px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
.site-footer a{color:var(--muted)}
.site-footer a:hover{color:var(--ink)}
.site-footer nav{display:flex;gap:18px}
@media (min-width:640px){
  .app{padding-top:48px}
}

/* Sentence builder */
.build{font-size:clamp(1.4rem,5.8vw,1.85rem);line-height:2.15;margin:0 0 8px}
.bslot{
  display:inline-flex;align-items:baseline;gap:1px;padding:0 8px;margin:0 1px;
  background:var(--surface);border:1.5px solid var(--line);border-radius:10px;cursor:pointer;
  font:inherit;line-height:1.5;vertical-align:baseline;
}
.bslot[aria-current="true"]{border-color:var(--celadon);box-shadow:0 0 0 3px var(--celadon-soft)}
.bp{display:inline-block;min-width:1.15em;text-align:center;border-bottom:2px solid var(--celadon);color:var(--celadon);font-weight:700;line-height:1.15}
.bp .fill{display:inline-block;animation:drop .28s ease-out}
@media (prefers-reduced-motion:reduce){.bp .fill{animation:none}}
.pad-label{font-size:.9rem;color:var(--muted);margin:14px 0 8px}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}
.pad button{min-height:56px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer;font-size:1.4rem}
.pad button:hover{border-color:var(--muted)}
.pad button:active{background:var(--celadon-soft)}
@media (max-width:360px){.pad{grid-template-columns:repeat(3,1fr)}}

/* Bonus writing */
.bonus{border:1px solid var(--line);border-radius:var(--radius);padding:20px;background:var(--surface)}
.bonus > p:first-child{margin-top:0}
.bonus .q-ko{font-size:1.3rem;line-height:1.6;margin:0 0 4px}
.bonus .q-en{color:var(--muted);margin:0 0 14px;font-size:.95rem}
.bonus textarea{
  width:100%;min-height:120px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;
  background:var(--paper);color:var(--ink);font-family:"Gowun Batang",serif;font-size:1.15rem;line-height:1.6;resize:vertical;
}
.bonus textarea:focus{outline:none;border-color:var(--celadon)}
.bonus-actions{display:grid;gap:10px;margin-top:12px}
.bonus .small{font-size:.88rem;color:var(--muted);margin:10px 0 0}
.model{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.model .ko-line{font-size:1.25rem;line-height:1.6;margin:0 0 10px}
.model ul{margin:0;padding-left:1.1em;font-size:.95rem}
.model li{margin-bottom:6px}
a.secondary[aria-disabled="true"]{opacity:.35;pointer-events:none}
</style>
</head>
<body>
<main id="app" class="app"></main>
<footer class="site-footer" id="footer"></footer>

<script>
/* =========================================================================
   CONFIG — edit these values only
   ========================================================================= */
const CONFIG = {
  // Workshop waitlist page. Opens in a new tab.
  workshopUrl: "https://www.joaacademy.com/event/workshop",
  // Adds ?utm_source=particle-check&utm_medium=diagnostic&utm_content=<profile>
  // so you can see which result sent people to the waitlist. Set to false to turn off.
  appendTracking: true,
  // $5 Particle Quick-Fix Kit checkout URL. Leave "" to hide the offer entirely.
  // It is never shown to the Foundation Ready profile.
  kitUrl: "",
  // Where learners can email their bonus sentences.
  contactEmail: "eliza@joaacademy.com",
  // Main website, linked in the footer.
  siteUrl: "https://www.joaacademy.com",
  // Optional: logo image URL shown at the top. Leave "" to show the text name.
  logoUrl: "",
  // Optional: privacy policy URL shown in the footer.
  privacyUrl: ""
};

/* =========================================================================
   PARTICLES
   ========================================================================= */
const PARTICLES = ["은","는","이","가","을","를"];
const FN = {"은":"topic","는":"topic","이":"subject","가":"subject","을":"object","를":"object"};
function hasBatchim(word){
  const c = word.trim().charCodeAt(word.trim().length - 1);
  return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0;
}
function formFor(word, fn){
  const b = hasBatchim(word);
  return {topic: b ? "은" : "는", subject: b ? "이" : "가", object: b ? "을" : "를"}[fn];
}

/* =========================================================================
   QUESTIONS
   Multiple choice — k: correct | form (right particle, wrong form) | half | error
   Builders — each slot scores by function (topic / subject / object);
   a wrong vowel/consonant form keeps the function's score and is reported separately.
   Builder item score = all slots right → 1, at least half → 0.5, else 0 (rounded down).
   ========================================================================= */
const S = null;
const QUESTIONS = [
  /* 1 · Roles */
  { dim:"R", type:"choice", short:"민수를 지우가 기다려요",
    context:"Read the sentence.",
    ko:["민수를 지우가 기다려요."],
    gloss:[["기다리다","to wait (for)"]],
    prompt:"What's happening?",
    options:[
      {t:"Minsu is waiting for Jiwoo.", k:"error", flag:"wordOrder", note:"This reads the sentence by position, the way English works. In Korean, the particles decide who does what."},
      {t:"Jiwoo is waiting for Minsu.", k:"correct"},
      {t:"They're waiting for each other.", k:"error", note:"Nothing here says 'each other'. 를 and 가 give each person one role."}
    ],
    explain:"를 marks Minsu as the one being waited for. 가 marks Jiwoo as the one waiting. Word order can move; the particles keep the roles. The more common order, 지우가 민수를 기다려요, means the same."
  },
  /* 2 · Patterns */
  { dim:"P", type:"blank", short:"의사___ 되고 싶었어요",
    context:"Someone asks about your childhood dream.",
    ko:["저는 의사", S, " 되고 싶었어요."], meaning:"I wanted to become a doctor.",
    gloss:[["의사","doctor"],["되다","to become"]],
    prompt:"Choose the particle that fits.",
    options:[
      {t:"를", k:"error", flag:"objTransfer", note:"In English, 'become' feels like it takes an object. In Korean, what you become takes 이/가."},
      {t:"가", k:"correct"},
      {t:"을", k:"error", flag:"objTransfer", note:"In English, 'become' feels like it takes an object. In Korean, what you become takes 이/가."},
      {t:"이", k:"form", note:"Right particle, but 의사 ends in a vowel, so it takes 가."}
    ],
    explain:"되다 doesn't take an object. What you become is marked with 이/가: 의사가 되다. You'll see the same with 아니다: 의사가 아니에요."
  },
  /* 3 · Patterns */
  { dim:"P", type:"blank", short:"도움___ 필요해요",
    context:"You're stuck with a heavy suitcase and ask a friend.",
    ko:["저 지금 도움", S, " 필요해요."], meaning:"I need help right now.",
    gloss:[["도움","help"],["필요하다","to be needed"]],
    prompt:"Choose the particle that fits.",
    options:[
      {t:"을", k:"error", flag:"objTransfer", note:"English 'need' takes an object. Korean 필요하다 means 'to be needed', so help is the subject."},
      {t:"가", k:"form", note:"Right particle, but 도움 ends in a consonant, so it takes 이."},
      {t:"를", k:"error", flag:"objTransfer", note:"English 'need' takes an object. Korean 필요하다 means 'to be needed', so help is the subject."},
      {t:"이", k:"correct"}
    ],
    explain:"필요하다 literally means 'to be needed'. So the thing needed is the subject: 도움이 필요해요, 'help is needed (by me)'. 도움 ends in a consonant, so 이."
  },
  /* 4 · Roles */
  { dim:"R", type:"blank", short:"동생___ 만든 케이크",
    context:"You're showing a friend a photo.",
    ko:["이거 제 동생", S, " 만든 케이크예요."], meaning:"This is a cake my younger sibling made.",
    gloss:[["동생","younger sibling"],["만들다","to make (만든 = that … made)"]],
    prompt:"Choose the particle that fits.",
    options:[
      {t:"은", k:"error", flag:"clauseTopic", note:"은/는 can't sit inside a describing phrase like 'that my sibling made'. Inside it, the one who acts takes 이/가."},
      {t:"이", k:"correct"},
      {t:"을", k:"error", note:"동생을 만든 케이크 would mean 'the cake that made my sibling'."},
      {t:"가", k:"form", note:"Right particle, but 동생 ends in a consonant, so it takes 이."}
    ],
    explain:"동생이 만든 describes the cake: 'that my sibling made'. Inside a describing phrase, the one doing the action takes 이/가. 은/는 doesn't appear there."
  },
  /* 5 · Roles */
  { dim:"R", type:"choice", short:"코끼리는 코가 길어요",
    context:"You're telling a child a general fact about elephants: they have long noses.",
    ko:[],
    gloss:[["코끼리","elephant"],["코","nose"],["길다","to be long"]],
    prompt:"Which sentence says this naturally?",
    options:[
      {t:"코끼리가 코를 길어요.", k:"error", ko:true, note:"길다 describes something, so it has no object. 코 can't take 를 here."},
      {t:"코끼리는 코가 길어요.", k:"correct", ko:true},
      {t:"코끼리를 코가 길어요.", k:"error", ko:true, note:"를 would make the elephant something being acted on."},
      {t:"코끼리가 코가 길어요.", k:"error", ko:true, note:"Grammatical, but it answers a different question: 'Which animal has a long nose?' It's the elephant."}
    ],
    explain:"One sentence, two roles. 코끼리는 sets the topic: 'as for elephants'. 코가 is the subject of 길다: 'the nose is long'. Korean uses this pattern constantly: 저는 키가 커요, 'I'm tall' (as for me, height is big)."
  },
  /* 6 · Context */

/* =========================================================================

   ========================================================================= */
const app = document.getElementById("app");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function freshState(){ return { screen:"intro", i:0, ans:Array(QUESTIONS.length).fill(null), active:0, result:null, busy:false, bonus:"" }; }
let state = freshState();

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const chevDown = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

function isAnswered(i){
  const a = state.ans[i];
  if(a === null) return false;
  if(Array.isArray(a)) return a.every(x => x);
  return true;
}
function brandHTML(){
  return CONFIG.logoUrl
    ? `<div class="brand"><img src="${esc(CONFIG.logoUrl)}" alt="Korean Joa Academy"></div>`
    : `<div class="brand"><span class="brand-mark" aria-hidden="true"></span>Korean Joa Academy</div>`;
}
function go(fn){
  const cur = app.firstElementChild;
  if(!cur || reduceMotion){ fn(); return; }
  cur.classList.add("leaving");
  setTimeout(fn, 170);
}
function focusHeading(){
  window.scrollTo(0,0);
  const h = app.querySelector("[data-focus]");
  if(h) h.focus({preventScroll:true});
}

/* =========================================================================
   QUESTION
   ========================================================================= */
function fillsFor(q, a){
  if(a === null || a === "U" || a === "N") return [];
  const o = q.options[a];
  return o.fill ? o.fill : [o.t];
}
function sentenceHTML(q, a, animate){
  const fills = fillsFor(q, a);
  let si = 0;
  return q.ko.map(p => {
    if(p !== null) return esc(p);
    const f = fills[si++];
    return f
      ? `<span class="slot filled">${animate ? `<span class="fill">${esc(f)}</span>` : esc(f)}</span>`
      : `<span class="slot">&nbsp;<span class="sr">blank</span></span>`;
  }).join("");
}
function buildHTML(q, a, animateSlot){
  const arr = Array.isArray(a) ? a : [];
  let si = 0;
  return q.parts.map(p => {
    if(typeof p === "string") return esc(p);
    const idx = si++, f = arr[idx];
    const label = `${p.w}, ${f ? "particle " + f : "no particle yet"}. Word ${idx + 1} of ${q.slots.length}.`;
    return `<button type="button" class="bslot ko" data-slot="${idx}" aria-current="${idx === state.active}" aria-label="${esc(label)}">${esc(p.w)}<span class="bp">${f ? (animateSlot === idx ? `<span class="fill">${esc(f)}</span>` : esc(f)) : "&nbsp;"}</span></button>`;
  }).join("");
}

function renderQuestion(){
  state.screen = "q";
  const i = state.i, q = QUESTIONS[i], a = state.ans[i], n = QUESTIONS.length;
  const segs = QUESTIONS.map((_, j) => `<span class="${j===i ? "now" : (isAnswered(j) ? "done" : "")}"></span>`).join("");
  const gloss = q.gloss ? `
    <div class="gloss">
      <p class="gloss-title">Words in this question</p>
      <dl>${q.gloss.map(([w, m]) => `<dt>${esc(w)}</dt><dd>${esc(m)}</dd>`).join("")}</dl>
    </div>` : "";
  const ctxKo = q.contextKo ? `<br><span class="ko">${esc(q.contextKo)}</span>` : "";
  const isLast = i === n - 1;
  let body;

  if(q.type === "build"){
    if(Array.isArray(a)){ const e = a.findIndex(x => !x); state.active = e === -1 ? 0 : e; }
    else state.active = 0;
    body = `
      <p class="build ko" id="build">${buildHTML(q, a)}</p>
      ${gloss}
      <h1 class="prompt" tabindex="-1" data-focus>Add a particle to each word.</h1>
      <p class="pad-label" id="padlabel">Tap a word, then a particle.</p>
      <div class="pad ko" role="group" aria-label="Particles">${PARTICLES.map(p => `<button type="button" data-p="${p}">${p}</button>`).join("")}</div>`;
  } else {
    const stack = q.type === "choice";
    const optsHTML = q.options.map((o, j) => {
      const isKo = q.type === "blank" || o.ko;
      return `<button class="opt${isKo ? " ko" : ""}" data-opt="${j}" aria-pressed="${a === j}">${esc(o.t)}</button>`;
    }).join("");
    body = `
      ${q.ko.length ? `<p class="sentence ko" id="sentence">${sentenceHTML(q, a, false)}</p>` : ""}
      ${q.meaning ? `<p class="meaning">${esc(q.meaning)}</p>` : ""}
      ${gloss}
      <h1 class="prompt" tabindex="-1" data-focus>${esc(q.prompt)}</h1>
      <div class="opts${stack ? " stack" : ""}" role="group" aria-label="Answer options">${optsHTML}</div>`;
  }

  app.innerHTML = `
  <div class="screen">
    <div class="topbar">
      <button class="back" id="back" aria-label="${i === 0 ? "Back to the start" : "Back to the previous question"}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Back
      </button>
      <div class="progress">
        <span class="progress-text">Question ${i + 1} of ${n}</span>
        <div class="segments" aria-hidden="true">${segs}</div>
      </div>
    </div>
    <p class="context">${esc(q.context)}${ctxKo}</p>
    ${body}
    <div class="alts" role="group" aria-label="If you're not ready to answer">
      <button class="alt" data-alt="U" aria-pressed="${a === "U"}">I'm not sure</button>
      <button class="alt" data-alt="N" aria-pressed="${a === "N"}">I haven't learned this yet</button>
    </div>
    <button class="primary" id="next" ${isAnswered(i) ? "" : "disabled"}>${isLast ? "See my result" : "Next"}</button>
    <p class="hint" id="hint">${isAnswered(i) ? "" : (q.type === "build" ? "Add a particle to every word to continue." : "Choose an answer to continue.")}</p>
  </div>`;

  if(q.type === "build"){
    bindBuild();
    app.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", () => pickParticle(b.dataset.p)));
  } else {
    app.querySelectorAll("[data-opt]").forEach(b => b.addEventListener("click", () => select(Number(b.dataset.opt))));
  }
  app.querySelectorAll("[data-alt]").forEach(b => b.addEventListener("click", () => select(b.dataset.alt)));
  document.getElementById("back").addEventListener("click", () => {
    if(state.i === 0) go(renderIntro);
    else { state.i--; go(renderQuestion); }
  });
  document.getElementById("next").addEventListener("click", next);
  focusHeading();
}

function bindBuild(){
  app.querySelectorAll("[data-slot]").forEach(b => b.addEventListener("click", () => {
    state.active = Number(b.dataset.slot);
    refreshBuild(null);
  }));
}
function refreshBuild(animateSlot, keepFocusSlot){
  const q = QUESTIONS[state.i];
  document.getElementById("build").innerHTML = buildHTML(q, state.ans[state.i], reduceMotion ? null : animateSlot);
  bindBuild();
  const w = q.slots[state.active].w;
  document.getElementById("padlabel").textContent = `Choose the particle for ${w}.`;
  if(keepFocusSlot){ const b = app.querySelector(`[data-slot="${state.active}"]`); if(b) b.focus(); }
  updateNext();
}
function pickParticle(p){
  const i = state.i, q = QUESTIONS[i];
  let arr = Array.isArray(state.ans[i]) ? state.ans[i].slice() : Array(q.slots.length).fill(null);
  const filled = state.active;
  arr[filled] = p;
  state.ans[i] = arr;
  const nextEmpty = arr.findIndex(x => !x);
  if(nextEmpty !== -1) state.active = nextEmpty;
  app.querySelectorAll("[data-alt]").forEach(b => b.setAttribute("aria-pressed", "false"));
  refreshBuild(filled);
}
function updateNext(){
  const ok = isAnswered(state.i);
  document.getElementById("next").disabled = !ok;
  const q = QUESTIONS[state.i];
  document.getElementById("hint").textContent = ok ? "" : (q.type === "build" ? "Add a particle to every word to continue." : "Choose an answer to continue.");
  const segs = app.querySelectorAll(".segments span");
  if(segs[state.i]) segs[state.i].className = "now";
}

function select(val){
  const i = state.i, q = QUESTIONS[i];
  state.ans[i] = val;
  app.querySelectorAll("[data-opt]").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.opt) === val)));
  app.querySelectorAll("[data-alt]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.alt === val)));
  if(q.type === "build"){ state.active = 0; refreshBuild(null); return; }
  const s = document.getElementById("sentence");
  if(s) s.innerHTML = sentenceHTML(q, val, !reduceMotion);
  updateNext();
}

function next(){
  if(!isAnswered(state.i)) return;
  if(state.i < QUESTIONS.length - 1){ state.i++; go(renderQuestion); return; }
  if(state.busy) return;
  state.busy = true;
  document.getElementById("next").disabled = true;
  state.result = score();
  go(() => { renderResult(); state.busy = false; });
}

/* =========================================================================
   SCORING — deterministic, from actual answers only
   ========================================================================= */
function scoreBuild(q, arr){
  const slots = q.slots.map((sl, si) => {
    const p = arr[si], fn = FN[p];
    const right = formFor(sl.w, fn) === p;
    const pts = sl.s[fn];
    const keyFn = Object.keys(sl.s).find(k => sl.s[k] === 1);
    return { p, fn, pts, formSlip: !right && pts > 0, flag: sl.flag && sl.flag[fn], note: sl.notes && sl.notes[fn], key: formFor(sl.w, keyFn) };
  });
  const mean = slots.reduce((t, s) => t + s.pts, 0) / slots.length;
  return { slots, pts: Math.floor(mean * 2 + 1e-9) / 2 };
}

function score(){
  const dims = {};
  Object.keys(DIMS).forEach(k => dims[k] = { ...DIMS[k], pts:0, u:0, n:0, marks:[] });
  const pts = [], flags = {}, formSlips = [], builds = {};
  let attempted = 0;

  QUESTIONS.forEach((q, i) => {
    const a = state.ans[i], d = dims[q.dim];
    if(a === "U" || a === "N"){
      a === "U" ? d.u++ : d.n++;
      pts[i] = null; d.marks.push("unknown"); return;
    }
    attempted++;
    let p;
    if(q.type === "build"){
      const b = scoreBuild(q, a);
      builds[i] = b; p = b.pts;
      b.slots.forEach(s => { if(s.formSlip) formSlips.push(i); if(s.flag) flags[s.flag] = true; });
    } else {
      const o = q.options[a];
      p = (o.k === "correct" || o.k === "form") ? 1 : (o.k === "half" ? 0.5 : 0);
      if(o.k === "form") formSlips.push(i);
      if(o.flag) flags[o.flag] = true;
    }
    pts[i] = p; d.pts += p;
    d.marks.push(p === 1 ? "full" : p === 0.5 ? "half" : "empty");
  });

  Object.values(dims).forEach(d => {
    d.nee = (d.u + d.n) >= 2;
    if(d.nee) d.band = "nee";
    else if(d.pts >= 3) d.band = "secure";
    else if(d.max === 3 ? d.pts >= 2 : d.pts >= 1.5) d.band = "developing";
    else d.band = "notyet";
    const order = {full:0, half:1, empty:2, unknown:3};
    d.marks.sort((x, y) => order[x] - order[y]);
  });

  const R = dims.R, P = dims.P, C = dims.C;
  const totalU = R.u + P.u + C.u, totalN = R.n + P.n + C.n;
  let profile, variant = "";
  // Ordered rules — first match wins
  if(attempted <= 4){ profile = "FB"; variant = "limited"; }
  else if(R.band === "notyet" || R.band === "nee"){ profile = "FB"; variant = "roles"; }
  else if(P.band === "secure" && C.band === "secure" && R.pts >= 2){ profile = "READY"; }
  else if(P.band !== "secure"){ profile = "RC"; }
  else { profile = "CD"; }

  return { dims, pts, flags, formSlips, builds, attempted, totalU, totalN, profile, variant };
}

  CD7:{ title:"Hearing what 은/는 leaves unsaid",
       ko:["A: 한국 음식 좋아해요?","B: 김치는 좋아해요."], en:"Do you like Korean food? Kimchi, I do like…",
       note:"Asked about Korean food in general, B narrows the answer with 는. The listener hears a quiet 'but not everything'. 김치를 좋아해요 would simply be 'I like kimchi.'" },
  CD9:{ title:"Answering 'who', then carrying on",
       ko:["민수 씨가 늦었어요.","민수 씨는 요즘 일이 많아요."], en:"Minsu was late. He has a lot of work these days.",
       note:"가 answers the 'who' question. Once Minsu is the person we're talking about, 는 continues with him. Building this yourself, rather than recognising it, is where it usually slips." },
  CD_try:"Take any short Korean dialogue: a textbook scene, a few webtoon panels. At each 은/는 and 이/가, pause and ask: is this new, already known, being contrasted, or answering 'who'? Then say one line of it aloud with the other particle and notice what changes.",
  READY:{ title:"Next layer: which particles survive in speech",
       ko:["A: 커피 마실래요?","B: 아니요, 커피는 안 마셔요."], en:"Want some coffee? No, coffee I don't drink.",
       note:"In conversation, 을/를 and 이/가 are often dropped: 커피 마실래요? is completely natural. But 은/는 tends to stay when it carries contrast, as in 커피는 안 마셔요 (maybe tea, then?). Knowing which particles native speakers keep, and why, is the layer after this one.",
       tryThis:"Watch one short drama scene with Korean subtitles. Mark each particle you see, and each place one could have gone but didn't. Notice which kind tends to stay." }
};

const STRENGTHS = [
  { test:r => r.pts[9] === 1, text:"You built a 'who' answer yourself: 민수 씨가 to answer, 민수 씨는 to carry on." },
  { test:r => r.pts[8] === 1, text:"You built the 좋다 / 싫어하다 sentence yourself, with the right particle on every word." },
  { test:r => r.pts[6] === 1, text:"You track new and known information: 한 소녀가 to introduce, 그 소녀는 to continue." },
  { test:r => r.pts[7] === 1, text:"You heard what 김치는 좋아해요 leaves unsaid." },
  { test:r => r.pts[5] === 1, text:"You volunteered with 제가 할게요, not 저는." },
  { test:r => r.pts[4] === 1, text:"You handled a topic and a subject in one sentence: 코끼리는 코가 길어요." },
  { test:r => r.pts[3] === 1, text:"You kept 은/는 out of a describing phrase: 동생이 만든 케이크." },
  { test:r => r.pts[1] === 1 && r.pts[2] === 1, text:"You didn't carry English 'become' and 'need' into Korean: 의사가 되다, 도움이 필요하다." },
  { test:r => r.pts[0] === 1, text:"You read who's doing what from the particles, not the word order." },
  { test:r => {
      const formItems = [1,2,3,5,6,8,9];
      const answered = formItems.filter(i => r.pts[i] !== null).length;
      return r.formSlips.length === 0 && answered >= 5;
    }, text:"Your vowel and consonant forms (는/은, 가/이, 를/을) were consistent throughout." }
];

function listJoin(arr){
  if(arr.length <= 1) return arr.join("");
  return arr.slice(0, -1).join(", ") + " and " + arr[arr.length - 1];
}

function buildResult(r){
  const { dims, flags, pts, profile, variant } = r;
  const P = dims.P, C = dims.C;
  let intro = [], pr, tryThis, nextStep;

  if(profile === "FB"){
    pr = PRIORITY.FB; tryThis = PRIORITY.FB.tryThis;
    if(variant === "limited"){
      const answered = r.attempted;
      const right = pts.filter(p => p === 1).length;
      intro.push(r.totalN >= r.totalU
        ? `You marked most of these questions as not yet learned, so this result is about where to begin rather than what went wrong.`
        : `You chose "I'm not sure" on most of these questions, so your result is based on only ${answered} answer${answered === 1 ? "" : "s"}.`);
      if(answered > 0 && right === answered) intro.push(`The ${answered === 1 ? "question" : answered + " questions"} you did answer, you answered correctly. You may know more than you're giving yourself credit for.`);
      else if(answered > 0) intro.push(`Of the ${answered} you answered, ${right} ${right === 1 ? "was" : "were"} fully correct.`);
      intro.push(`Either way, the most useful place to start is the basic job each particle does.`);
    } else {
      intro.push(`Your answers suggest the basic jobs of the particles (who acts, what's acted on, what we're talking about) aren't yet distinct for you. That's the right place to start, because every other particle choice builds on it.`);
      if(flags.wordOrder) intro.push(`On the 민수/지우 question, you read the sentence by word order, the way English works. In Korean, the particles decide the roles.`);
      if(r.totalN >= 3) intro.push(`You also marked ${r.totalN} questions as not yet learned, so much of this is simply new.`);
    }
    nextStep = "Build the three roles first with a clear reference, then practise them in short, real sentences.";
  }

  if(profile === "RC"){
    const swapped = flags.likeObj && flags.hateSubj;
    const likeIssue = flags.likeObj || flags.hateSubj || (pts[8] !== null && pts[8] < 1);
    pr = likeIssue ? PRIORITY.RC_like : (flags.objTransfer ? PRIORITY.RC_obj : PRIORITY.RC_like);
    tryThis = PRIORITY.RC_try;
    intro.push(`You recognise what the particles do in simple sentences. Where it slips is with specific verbs, where the particle follows the verb's own pattern rather than English logic.`);
    if(swapped) intro.push(`In the sentence you built, the 좋다 and 싫어하다 patterns were swapped: 를 with 좋다 and 가 with 싫어하다. It's a very common pattern, and a quick one to settle once you see why.`);
    else if(flags.likeObj) intro.push(`In the sentence you built, you used 를 with 좋아요. That's the pattern for 좋아하다; 좋다 takes 이/가.`);
    else if(flags.hateSubj) intro.push(`In the sentence you built, you used 가 with 싫어해요. 싫어하다 is something you do toward a thing, so it takes 을/를.`);
    if(flags.objTransfer) intro.push(`You also reached for 을/를 where English would use an object (become, need, have a lot of). Korean treats these verbs differently.`);
    if(P.band === "nee") intro.push(`You marked most of the pattern questions as unfamiliar, so this is more about exposure than error.`);
    intro.push(C.band === "secure"
      ? `Your context answers were solid, which suggests these verb patterns are the one piece to settle.`
      : `Your context answers were mixed too. That's expected, since those choices build on the verb patterns.`);
    nextStep = "These patterns settle fastest with guided practice in real sentences, rather than rules in isolation.";
  }

  if(profile === "CD"){
    const labels = {5:"answering 'who' (제가 할게요)", 6:"new versus known information (한 소녀가, 그 소녀는)", 7:"hearing what 은/는 leaves unsaid (김치는)", 9:"building a 'who' answer and carrying on (민수 씨가… 민수 씨는…)"};
    const missed = [5,6,7,9].filter(i => pts[i] !== null && pts[i] < 1);
    const unknown = [5,6,7,9].filter(i => pts[i] === null);
    const first = missed.length ? missed[0] : unknown[0];
    pr = PRIORITY["CD" + first]; tryThis = PRIORITY.CD_try;
    intro.push(`Your particle roles and verb patterns held up. What's still forming is reading why a speaker picks 은/는 or 이/가: to answer 'who', introduce something new, carry it forward, or quietly set it apart.`);
    if(missed.length) intro.push(`In your answers, that showed up in ${listJoin(missed.map(i => labels[i]))}.`);
    if(C.band === "nee") intro.push(`You marked most context questions as unfamiliar. These choices are usually taught later, so that's expected.`);
    else if(unknown.length && !missed.length) intro.push(`You weren't sure about ${listJoin(unknown.map(i => labels[i]))}, so that's the place to look first.`);
    nextStep = "Contextual choices settle fastest with guided practice in real situations, where you can hear why one particle fits and another doesn't.";
  }

  if(profile === "READY"){
    pr = PRIORITY.READY; tryThis = PRIORITY.READY.tryThis;
    intro.push(`Your answers were strong across all three areas this check covers, including the two sentences you built yourself. That's the harder part: producing the right particle, not just recognising it.`);
    const missed = QUESTIONS.map((_, i) => i).filter(i => pts[i] !== 1);
    if(missed.length){
      intro.push(`${missed.length === 1 ? "One question" : "A few questions"} (${listJoin(missed.map(i => QUESTIONS[i].short))}) ${missed.length === 1 ? "is" : "are"} worth a look in the review below, but ${missed.length === 1 ? "it doesn't" : "they don't"} change the overall picture.`);
    }
    intro.push(`Ten questions can't cover all of particles, so the useful next move is a layer this check didn't test.`);
    nextStep = "If you'd like to keep going at this level, the next workshop is where these choices move into real conversation.";
  }

  const strengths = STRENGTHS.filter(s => s.test(r)).slice(0, 2).map(s => s.text);
  return { intro, pr, tryThis, nextStep, strengths };
}

function workshopHref(profile){
  if(!CONFIG.appendTracking) return CONFIG.workshopUrl;
  try{
    const u = new URL(CONFIG.workshopUrl);
    u.searchParams.set("utm_source","particle-check");
    u.searchParams.set("utm_medium","diagnostic");
    u.searchParams.set("utm_content", PROFILES[profile].id);
    return u.toString();
  }catch(e){ return CONFIG.workshopUrl; }
}

const KIT_COPY = {
  FB:"Want a clear reference to start from? The Particle Quick-Fix Kit has concise explanations, contextual examples, common mistakes and practice.",
  RC:"Want to work on the verb patterns you just met? The Particle Quick-Fix Kit has concise explanations, contextual examples, common mistakes and practice.",
  CD:"Want a compact reference to keep alongside practice? The Particle Quick-Fix Kit has concise explanations, contextual examples, common mistakes and practice."
};

const BONUS = {
  ko:"한국의 어떤 점이 좋아요? 그리고 한국어를 공부할 때 뭐가 어려워요?",
  en:"What do you like about Korea? And what's hard when you study Korean?",
  model:"저는 한국 음식이 정말 좋아요. 그런데 한국어 발음은 좀 어려워요. 특히 조사가 어려워요!",
  modelEn:"I really like Korean food. But Korean pronunciation is a bit hard. Particles especially are hard!",
  notes:[
    "음식이 좋아요: 좋다 describes, so the thing you like takes 이/가.",
    "발음은 어려워요: 은 sets pronunciation against the food you just mentioned.",
    "조사가 어려워요: 어렵다 also describes, so 이/가. (조사 means 'particles'.)"
  ]
};

/* =========================================================================
   RESULT
   ========================================================================= */
function joinBuilt(q, picks){
  let si = 0;
  return q.parts.map(p => typeof p === "string" ? p : p.w + picks[si++]).join("");
}

function renderResult(){
  state.screen = "result";
  const r = state.result, c = buildResult(r), prof = PROFILES[r.profile];
  const bandText = {secure:"Secure", developing:"Developing", notyet:"Not yet", nee:"Mostly unfamiliar"};

  const dimsHTML = Object.values(r.dims).map(d => {
    const nu = d.u + d.n;
    const dots = d.marks.map(m => `<span class="dot ${m}"></span>`).join("");
    const count = `${Number.isInteger(d.pts) ? d.pts : d.pts.toFixed(1)} of ${d.max}${nu ? `, ${nu} not answered` : ""}`;
    return `<div class="dim">
      <span class="dim-name">${d.name}</span>
      <span class="dim-band ${d.band}">${bandText[d.band]}</span>
      <span class="dots" aria-label="${count}">${dots}<span class="dim-count" aria-hidden="true">${count}</span></span>
    </div>`;
  }).join("");

  const strengthsHTML = c.strengths.length ? `
    <section class="block">
      <h2>What your answers show you can do</h2>
      <ul class="strengths">${c.strengths.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
    </section>` : "";

  const nForm = r.formSlips.length;
  const formNote = nForm ? `
    <div class="note-form">You chose the right particle but the wrong form ${nForm === 1 ? "once" : nForm + " times"}. The rule is about sound: after a consonant, 은 / 이 / 을; after a vowel, 는 / 가 / 를. (저 + 가 becomes 제가.)</div>` : "";

  const kitHTML = (CONFIG.kitUrl && r.profile !== "READY") ? `
    <div class="kit">
      <p>${esc(KIT_COPY[r.profile])}</p>
      <a class="secondary" href="${esc(CONFIG.kitUrl)}" target="_blank" rel="noopener">Get the Quick-Fix Kit ($5)</a>
      <p class="small">Optional. Your full result on this page is free.</p>
    </div>` : "";

  const statusOf = i => {
    const a = state.ans[i], q = QUESTIONS[i];
    if(a === "U") return {cls:"unsure", label:"Not sure"};
    if(a === "N") return {cls:"notlearned", label:"Not learned yet"};
    if(q.type === "build"){
      const p = r.pts[i], hasForm = r.builds[i].slots.some(s => s.formSlip);
      if(p === 1) return hasForm ? {cls:"form", label:"Right particles, form slip"} : {cls:"correct", label:"Correct"};
      return p === 0.5 ? {cls:"half", label:"Partly right"} : {cls:"error", label:"Not this one"};
    }
    const k = q.options[a].k;
    return {correct:{cls:"correct",label:"Correct"}, form:{cls:"form",label:"Right particle, form slip"}, half:{cls:"half",label:"Half right"}, error:{cls:"error",label:"Not this one"}}[k];
  };

  const reviewHTML = QUESTIONS.map((q, i) => {
    const st = statusOf(i), a = state.ans[i];
    let inner;
    if(q.type === "build"){
      const keys = q.slots.map(sl => formFor(sl.w, Object.keys(sl.s).find(k => sl.s[k] === 1)));
      const b = r.builds[i];
      const notes = b ? b.slots.map((s, si) => {
        if(s.pts === 1 && !s.formSlip) return "";
        const w = q.slots[si].w;
        const t = s.formSlip && s.pts === 1 ? `Right particle, but ${w} takes ${s.key} for this form.` : (s.note || "");
        return t ? `<p><span class="ko">${esc(w + s.p)}</span>: ${esc(t)}</p>` : "";
      }).join("") : "";
      inner = `
        ${b ? `<p><span class="lbl">You built:</span> <span class="ko">${esc(joinBuilt(q, a))}</span></p>` : ""}
        <p><span class="lbl">Natural here:</span> <span class="ko">${esc(joinBuilt(q, keys))}</span></p>
        ${notes}`;
    } else {
      const correct = q.options.find(o => o.k === "correct");
      const chosen = (typeof a === "number") ? q.options[a] : null;
      const koAns = q.type === "blank" || (correct && correct.ko);
      inner = `
        ${chosen ? `<p><span class="lbl">Your answer:</span> <span class="${koAns || chosen.ko ? "ko" : ""}">${esc(chosen.t)}</span></p>` : ""}
        <p><span class="lbl">Answer:</span> <span class="${koAns ? "ko" : ""}">${esc(correct.t)}</span></p>
        ${chosen && chosen.note ? `<p>${esc(chosen.note)}</p>` : ""}`;
    }
    return `<details class="qrev">
      <summary><span class="qrev-num">${i + 1}</span><span class="qrev-short ko">${esc(q.short)}</span><span class="tag ${st.cls}">${st.label}</span></summary>
      <div class="qrev-body">${inner}<p>${esc(q.explain)}</p></div>
    </details>`;
  }).join("");

  const bonusHTML = `
    <section class="block">
      <h2>One more, just for you (not scored)</h2>
      <div class="bonus">
        <p>Choosing is easier than producing. Try answering this in two or three Korean sentences, using the particles that fit.</p>
        <p class="q-ko ko">${esc(BONUS.ko)}</p>
        <p class="q-en">${esc(BONUS.en)}</p>
        <label class="sr" for="bonus-text">Your answer in Korean</label>
        <textarea id="bonus-text" lang="ko" placeholder="저는 …">${esc(state.bonus)}</textarea>
        <div class="bonus-actions">
          <a class="primary celadon" id="bonus-mail" href="#" aria-disabled="true">Email my answer to Eliza</a>
          <button type="button" class="secondary" id="bonus-model" aria-expanded="false" aria-controls="bonus-model-box">Compare with a model answer</button>
        </div>
        <p class="small" id="bonus-status">Your email app opens with your sentences ready. Nothing is sent until you press send. You can also write to <a href="mailto:${esc(CONFIG.contactEmail)}">${esc(CONFIG.contactEmail)}</a>.</p>
        <div class="model" id="bonus-model-box" hidden>
          <p class="ko-line ko">${esc(BONUS.model)}</p>
          <p class="small" style="margin:0 0 10px">${esc(BONUS.modelEn)}</p>
          <ul>${BONUS.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>
          <p class="small">Many answers are possible. This is one natural version, not the only right one.</p>
        </div>
      </div>
    </section>`;

  app.innerHTML = `
  <div class="screen">
    ${brandHTML()}
    <p class="result-kicker">Your Particle Check result</p>
    <h1 class="result-title" tabindex="-1" data-focus>${prof.title}</h1>
    ${c.intro.map((p, i) => `<p class="${i === 0 ? "result-intro" : ""}">${esc(p)}</p>`).join("")}

    <section class="block">
      <h2>Your three areas</h2>
      <div class="dims">${dimsHTML}</div>
    </section>

    ${strengthsHTML}

    <section class="block">
      <h2>${r.profile === "READY" ? "Your next challenge" : "Most useful to practise next"}</h2>
      <p class="priority-title ko">${esc(c.pr.title)}</p>
      <div class="example">
        ${c.pr.ko.map(l => `<p class="ko-line ko">${esc(l)}</p>`).join("")}
        <p class="en">${esc(c.pr.en)}</p>
        <p class="note">${esc(c.pr.note)}</p>
      </div>
      ${formNote}
    </section>

    <section class="block">
      <h2>Try this today</h2>
      <p>${esc(c.tryThis)}</p>
    </section>

    <section class="block">
      <h2>A next step that fits this result</h2>
      <p>${esc(c.nextStep)}</p>
      <div class="next">
        <h3>Want to practise more? Join the next workshop.</h3>
        <p>This check showed you where you are. A workshop is where it starts to feel natural: one focused session, real Korean, and the moment the rules you've read about finally make sense in use.</p>
        <a class="primary celadon" href="${esc(workshopHref(r.profile))}" target="_blank" rel="noopener">See the next workshop</a>
        <p class="small">Joining the waitlist is free. You'll be the first to hear when registration opens.</p>
      </div>
      ${kitHTML}
    </section>

    ${bonusHTML}

    <section class="block">
      <details class="review-all">
        <summary>Review your answers ${chevDown}</summary>
        ${reviewHTML}
      </details>
    </section>

    <button class="secondary restart" id="restart">Take the check again</button>

    <div class="fine">
      <p>A note on real speech: particles are often dropped in casual Korean (김치 좋아요, 커피 마셔요). Knowing which one belongs there still matters. It's what lets you hear the difference when a speaker does use one.</p>
      <p>This is an informal learning check, not a proficiency test. Ten questions give a useful picture, not a complete one.</p>
    </div>
  </div>`;

  bindBonus(prof.title);
  document.getElementById("restart").addEventListener("click", () => { state = freshState(); go(renderIntro); });
  focusHeading();
}

function bindBonus(profileTitle){
  const ta = document.getElementById("bonus-text");
  const mail = document.getElementById("bonus-mail");
  const modelBtn = document.getElementById("bonus-model");
  const box = document.getElementById("bonus-model-box");
  const update = () => {
    state.bonus = ta.value;
    const text = ta.value.trim();
    if(!text || !CONFIG.contactEmail){
      mail.setAttribute("aria-disabled","true"); mail.href = "#"; return;
    }
    const subject = "My Particle Check sentences";
    const body = `안녕하세요 Eliza,\n\nHere's my answer to the bonus question:\n${BONUS.ko}\n\n${text}\n\n(My Particle Check result: ${profileTitle})`;
    mail.href = `mailto:${CONFIG.contactEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    mail.removeAttribute("aria-disabled");
  };
  ta.addEventListener("input", update);
  mail.addEventListener("click", e => { if(mail.getAttribute("aria-disabled") === "true"){ e.preventDefault(); ta.focus(); } });
  modelBtn.addEventListener("click", () => {
    const open = box.hidden;
    box.hidden = !open;
    modelBtn.setAttribute("aria-expanded", String(open));
    modelBtn.textContent = open ? "Hide the model answer" : "Compare with a model answer";
  });
  update();
}

function renderFooter(){
  const links = [`<a href="${esc(CONFIG.siteUrl)}" target="_blank" rel="noopener">joaacademy.com</a>`];
  if(CONFIG.privacyUrl) links.push(`<a href="${esc(CONFIG.privacyUrl)}" target="_blank" rel="noopener">Privacy policy</a>`);
  document.getElementById("footer").innerHTML =
    `<span>© ${new Date().getFullYear()} Joa Academy. All rights reserved.</span><nav aria-label="Footer">${links.join("")}</nav>`;
}
renderFooter();
renderIntro();
